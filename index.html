<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="card-header">
      <div>
        <h1>Team To-Do List</h1>
        <p class="subtitle">Lightweight task tracking for software teams</p>
      </div>
      <span class="badge">Active Sprint</span>
    </header>

    <!-- [TDL-4] Add a new task -->
    <form id="task-form" class="task-form">
      <input id="task-input" type="text" placeholder="What needs to be done?" autocomplete="off">
      <button type="submit" class="add-btn">Add</button>
    </form>

    <ul id="task-list" class="task-list"></ul>

    <footer class="card-footer">
      <span id="task-count"></span>
      <span class="style-note">Linear &amp; Jira Minimalist Style</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
